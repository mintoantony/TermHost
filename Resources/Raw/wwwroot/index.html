<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="xterm.css">
<style>
  :root {
    --bg: #1e1e2e; --chrome: #181825; --surface: #313244; --border: #45475a;
    --fg: #cdd6f4; --muted: #a6adc8; --accent: #cba6f7; --accent-fg: #181825;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; overflow: hidden; background: var(--chrome); color: var(--fg); font: 13px "Segoe UI Variable Text", "Segoe UI", sans-serif; }
  body { display: flex; flex-direction: column; }
  button { font: inherit; color: inherit; border: 0; background: none; padding: 0; cursor: pointer; outline: none; }
  button:focus-visible { box-shadow: 0 0 0 2px var(--accent); }
  .icon { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  /* Top bar */
  #bar { flex: none; display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 8px; }
  #tabs { flex: 1; min-width: 0; display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; }
  #brand { flex: 1; display: none; align-items: center; gap: 8px; padding-left: 4px; color: var(--muted); }
  #brand .icon { color: var(--accent); }
  body.grid #tabs { display: none; }
  body.grid #brand { display: flex; }

  .tab { flex: none; display: flex; align-items: center; gap: 7px; height: 28px; padding: 0 5px 0 10px; border-radius: 7px; color: var(--muted); white-space: nowrap; user-select: none; cursor: pointer; }
  .tab:hover { background: var(--surface); }
  .tab.active { background: var(--bg); color: var(--fg); box-shadow: inset 0 0 0 1px var(--border); }
  .tab.active > .icon { color: var(--accent); }
  .close { display: grid; place-items: center; width: 18px; height: 18px; border-radius: 5px; color: var(--muted); opacity: 0; }
  .close .icon { width: 12px; height: 12px; }
  .close:hover { background: var(--border); color: var(--fg); }
  .tab:hover .close, .tab.active .close, .head .close { opacity: 1; }

  #actions { flex: none; display: flex; align-items: center; gap: 4px; }
  .btn { display: grid; place-items: center; width: 28px; height: 28px; border-radius: 7px; color: var(--muted); }
  .btn:hover { background: var(--surface); color: var(--fg); }
  #new { color: var(--accent); }
  #layout { display: flex; gap: 2px; padding: 2px; border-radius: 8px; background: var(--bg); box-shadow: inset 0 0 0 1px var(--border); }
  #layout span { display: grid; place-items: center; width: 26px; height: 22px; border-radius: 6px; color: var(--muted); transition: background .15s, color .15s; }
  body.tabs #layout span:first-child, body.grid #layout span:last-child { background: var(--accent); color: var(--accent-fg); }

  /* Tooltips */
  [data-tip] { position: relative; }
  [data-tip]::after {
    content: attr(data-tip); position: absolute; top: calc(100% + 8px); right: 0; z-index: 20;
    padding: 5px 9px; border-radius: 6px; background: var(--surface); color: var(--fg); box-shadow: 0 0 0 1px var(--border), 0 6px 16px rgb(0 0 0 / .35);
    font-size: 12px; white-space: nowrap; pointer-events: none; opacity: 0; transition: opacity .12s;
  }
  [data-tip]:hover::after { opacity: 1; transition-delay: .35s; }

  /* Terminals */
  #main { flex: 1; min-height: 0; display: flex; }
  #panes { flex: 1; min-width: 0; min-height: 0; display: grid; gap: 6px; padding: 0 6px 6px; }
  .pane { display: flex; flex-direction: column; min-width: 0; min-height: 0; overflow: hidden; background: var(--bg); border: 1px solid var(--border); border-radius: 9px; }
  body.tabs .pane:not(.active) { display: none; }
  body.grid .pane.active { border-color: var(--accent); }
  .head { display: none; flex: none; align-items: center; gap: 7px; height: 26px; padding: 0 4px 0 10px; font-size: 12px; color: var(--muted); background: color-mix(in srgb, var(--surface) 45%, var(--bg)); user-select: none; }
  .head .title { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  body.grid .head { display: flex; }
  body.grid .pane.active .head { color: var(--fg); }
  body.grid .pane.active .head > .icon { color: var(--accent); }
  .term { flex: 1; min-height: 0; padding: 6px 2px 4px 8px; overflow: hidden; }

  #empty { flex: 1; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 12px; color: var(--muted); }
  #empty button { display: grid; place-items: center; width: 56px; height: 56px; border-radius: 16px; background: var(--surface); color: var(--accent); }
  #empty button:hover { background: var(--border); }
  #empty .icon { width: 26px; height: 26px; }
  body.empty #panes { display: none; }
  body.empty #empty { display: flex; }

  /* Claude status panel */
  #status { position: relative; }
  #status .dot { position: absolute; top: 3px; right: 3px; display: none; box-shadow: 0 0 0 2px var(--chrome); }
  #status .dot.running, #status .dot.waiting { display: block; }
  body.claude-open #status, body.git-open #git { background: var(--surface); color: var(--accent); }
  .running { --c: var(--green); } .waiting { --c: var(--yellow); } .failed, .error { --c: var(--red); }
  .done, .tool { --c: var(--blue); } .idle, .unknown, .stopped { --c: var(--muted); } .prompt { --c: var(--accent); } .system { --c: var(--yellow); }
  .dot { flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--c); }
  .dot.running, .dot.waiting { animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .35; } }

  .panel { display: none; flex: none; flex-direction: column; width: 400px; min-height: 0; margin: 0 6px 6px 0; overflow: hidden; background: var(--bg); border: 1px solid var(--border); border-radius: 9px; }
  body.claude-open #claude-panel, body.git-open #git-panel { display: flex; }
  .c-head { flex: none; display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 4px 0 12px; background: color-mix(in srgb, var(--surface) 45%, var(--bg)); }
  .c-head > .icon { color: var(--accent); }
  .c-head h2 { margin: 0; font-size: 13px; font-weight: 600; }
  .c-head span { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; color: var(--muted); }
  #claude-usage { flex: none; display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 2px 10px; padding: 10px 12px; border-bottom: 1px solid var(--border); font-size: 12px; }
  #claude-usage:empty { display: none; }
  #claude-usage b { font-weight: 600; }
  #claude-usage .pct { font: 12px "Cascadia Mono", Consolas, monospace; color: var(--c); }
  #claude-usage .note { grid-column: 1 / -1; margin-bottom: 6px; font-size: 11px; color: var(--muted); }
  #claude-usage .note:last-child { margin-bottom: 0; }
  .meter { height: 6px; overflow: hidden; border-radius: 3px; background: var(--surface); }
  .meter i { display: block; height: 100%; border-radius: 3px; background: var(--c); }
  .low { --c: var(--green); } .mid { --c: var(--yellow); } .high { --c: var(--red); }
  .panel-body { flex: 1; min-height: 0; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
  .panel-body, .list { scrollbar-width: thin; scrollbar-color: var(--border) transparent; }
  .c-empty { margin: auto; padding: 0 24px; text-align: center; color: var(--muted); }
  .c-section { display: flex; align-items: center; gap: 6px; margin: 8px 2px 0; font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
  .c-section .icon, .card .icon { width: 12px; height: 12px; }

  .card { flex: none; border: 1px solid var(--border); border-radius: 9px; background: color-mix(in srgb, var(--surface) 30%, var(--bg)); }
  .card-meta .here { color: var(--accent); }
  .repo-top { padding: 9px 10px 6px; }
  .repo-top .row .icon { color: var(--muted); }
  .link { color: var(--accent) !important; cursor: pointer; }
  .link:hover { text-decoration: underline; }
  .tree { border-top: 1px solid var(--border); }
  .tree.open { background: color-mix(in srgb, var(--surface) 40%, transparent); }
  .tree:last-child { border-radius: 0 0 8px 8px; }
  .tree-top { padding: 5px 10px 7px; cursor: pointer; user-select: none; }
  .tree-path { margin-left: 19px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 11px; color: var(--muted); }
  .tree-body { padding: 2px 10px 10px; }
  .chip, .code { flex: none; font: 11px "Cascadia Mono", Consolas, monospace; color: var(--c, var(--muted)); }
  .code { width: 18px; }
  .staged, .clean { --c: var(--green); } .changed { --c: var(--yellow); } .untracked { --c: var(--muted); } .conflict { --c: var(--red); }
  .card.open { border-color: color-mix(in srgb, var(--accent) 60%, var(--border)); }
  .card-top { padding: 9px 10px; cursor: pointer; user-select: none; }
  .card-line { display: flex; align-items: center; gap: 8px; }
  .card-title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
  .pill { flex: none; padding: 1px 8px; border-radius: 999px; font-size: 11px; color: var(--c); background: color-mix(in srgb, var(--c) 16%, transparent); }
  .card-meta { display: flex; flex-wrap: wrap; gap: 3px 12px; margin: 5px 0 0 16px; font-size: 12px; color: var(--muted); }
  .card-meta span { display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
  .card-body { padding: 8px 10px 10px; border-top: 1px solid var(--border); }
  .kv { display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; font-size: 12px; color: var(--muted); }
  .kv span { color: var(--fg); overflow-wrap: anywhere; }
  .sub { display: flex; align-items: center; gap: 6px; margin: 12px 0 4px; font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
  .list { max-height: 230px; overflow-y: auto; padding-right: 6px; font-size: 12px; }
  .row { display: flex; align-items: center; gap: 7px; min-width: 0; padding: 3px 0; }
  .row .icon { color: var(--c); }
  .row b { flex: none; max-width: 45%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
  .row .text { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); }
  .row.prompt .text { color: var(--fg); }
  .row .num { flex: none; font: 11px "Cascadia Mono", Consolas, monospace; color: var(--muted); }

  /* Settings */
  dialog { width: 460px; max-width: calc(100vw - 32px); padding: 18px 20px 20px; border: 1px solid var(--border); border-radius: 14px; background: var(--chrome); color: var(--fg); box-shadow: 0 24px 60px rgb(0 0 0 / .5); }
  dialog::backdrop { background: rgb(0 0 0 / .45); backdrop-filter: blur(3px); }
  .dlg-head { display: flex; align-items: center; gap: 9px; margin-bottom: 14px; }
  .dlg-head > .icon { color: var(--accent); }
  .dlg-head h2 { flex: 1; margin: 0; font-size: 15px; font-weight: 600; }
  .field { display: block; margin-top: 12px; font-size: 12px; color: var(--muted); }
  select, input { display: block; width: 100%; margin-top: 5px; padding: 7px 9px; border: 1px solid var(--border); border-radius: 7px; background: var(--bg); color: var(--fg); font: inherit; outline: none; }
  input { font-family: "Cascadia Mono", Consolas, monospace; }
  select:focus, input:focus { border-color: var(--accent); }
  .hint { margin: 5px 0 0; font-size: 12px; color: var(--muted); opacity: .8; }
  #themes { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 6px; }
  .swatch { display: flex; flex-direction: column; gap: 7px; padding: 9px; border-radius: 9px; border: 2px solid transparent; text-align: left; font-size: 11px; line-height: 1.2; }
  .swatch.selected { border-color: var(--accent); }
  .swatch i { display: flex; gap: 3px; }
  .swatch b { width: 9px; height: 9px; border-radius: 50%; }
</style>
</head>

<header id="bar">
  <div id="tabs"></div>
  <div id="brand"><svg class="icon"><use href="#i-terminal"/></svg><span id="count"></span></div>
  <div id="actions">
    <button id="new" class="btn" data-tip="New terminal" aria-label="New terminal"><svg class="icon"><use href="#i-plus"/></svg></button>
    <button id="layout" role="switch" aria-label="Tile terminals evenly">
      <span><svg class="icon"><use href="#i-tabs"/></svg></span>
      <span><svg class="icon"><use href="#i-grid"/></svg></span>
    </button>
    <button id="status" class="btn" data-tip="Claude status" aria-label="Claude status"><svg class="icon"><use href="#i-bot"/></svg><span class="dot"></span></button>
    <button id="git" class="btn" data-tip="Git" aria-label="Git"><svg class="icon"><use href="#i-branch"/></svg></button>
    <button id="settings" class="btn" data-tip="Settings" aria-label="Settings"><svg class="icon"><use href="#i-settings"/></svg></button>
  </div>
</header>

<div id="main">
  <div id="panes"></div>
  <div id="empty">
    <button id="empty-new" title="New terminal" aria-label="New terminal"><svg class="icon"><use href="#i-plus"/></svg></button>
    <span>No terminals open</span>
  </div>
  <aside id="claude-panel" class="panel">
    <div class="c-head">
      <svg class="icon"><use href="#i-bot"/></svg>
      <h2>Claude</h2>
      <span id="claude-summary"></span>
      <button id="claude-close" class="btn" title="Close" aria-label="Close"><svg class="icon"><use href="#i-x"/></svg></button>
    </div>
    <div id="claude-usage"></div>
    <div id="claude-body" class="panel-body"></div>
  </aside>
  <aside id="git-panel" class="panel">
    <div class="c-head">
      <svg class="icon"><use href="#i-branch"/></svg>
      <h2>Git</h2>
      <span id="git-summary"></span>
      <button id="git-close" class="btn" title="Close" aria-label="Close"><svg class="icon"><use href="#i-x"/></svg></button>
    </div>
    <div id="git-body" class="panel-body"></div>
  </aside>
</div>

<dialog id="dialog">
  <div class="dlg-head">
    <svg class="icon"><use href="#i-settings"/></svg>
    <h2>Settings</h2>
    <button id="dialog-close" class="btn" title="Close" aria-label="Close"><svg class="icon"><use href="#i-x"/></svg></button>
  </div>
  <label class="field">Default terminal<select id="shell"></select></label>
  <label class="field">Startup program<input id="program" autofocus spellcheck="false" autocomplete="off" placeholder="claude, copilot, .\scripts\dev.ps1 …"></label>
  <p class="hint">Runs in every new terminal. Leave empty for a plain shell.</p>
  <div class="field">Theme</div>
  <div id="themes"></div>
</dialog>

  const ANSI_NAMES = ['black', 'red', 'green', 'yellow', 'blue', 'magenta', 'cyan', 'white',
    'brightBlack', 'brightRed', 'brightGreen', 'brightYellow', 'brightBlue', 'brightMagenta', 'brightCyan', 'brightWhite'];

  const $ = id => document.getElementById(id);
  const tabsEl = $('tabs'), panesEl = $('panes'), dialog = $('dialog');
  const terms = new Map(); // id -> { term, fit, pane, tab }
  let activeId = null;
  let settings = { shell: '', program: '', theme: 'Catppuccin Mocha', layout: 'tabs' };

  const send = msg => window.HybridWebView.SendRawMessage(JSON.stringify(msg));
  const saveSettings = () => send({ t: 'settings', ...settings });
  const icon = name => `<svg class="icon"><use href="#i-${name}"/></svg>`;
  const closeButton = '<button class="close" title="Close" aria-label="Close">' + icon('x') + '</button>';

  function termTheme(theme) {
    const colors = { background: theme.bg, foreground: theme.fg, cursor: theme.accent, cursorAccent: theme.bg, selectionBackground: theme.accent + '55' };
    theme.ansi.split(' ').forEach((color, i) => colors[ANSI_NAMES[i]] = color);
    return colors;
  }

  function applyTheme(name) {
    const theme = THEMES[name] ?? THEMES['Catppuccin Mocha'];
    const root = document.documentElement.style;
    for (const key of ['bg', 'chrome', 'surface', 'border', 'fg', 'muted', 'accent'])
      root.setProperty('--' + key, theme[key]);
    root.setProperty('--accent-fg', theme.dark ? theme.chrome : '#ffffff');
    // Status colours of the Claude panel: the theme's bright red, green, yellow and blue.
    ['red', 'green', 'yellow', 'blue'].forEach((name, i) => root.setProperty('--' + name, theme.ansi.split(' ')[9 + i]));
    root.colorScheme = theme.dark ? 'dark' : 'light';
    for (const entry of terms.values()) entry.term.options.theme = termTheme(theme);
    for (const swatch of $('themes').children) swatch.classList.toggle('selected', swatch.dataset.name === name);
    // The native title bar follows the theme too.
    send({ t: 'chrome', bg: theme.chrome, fg: theme.fg, dark: theme.dark });
  }

  function addTerminal(id, title) {
    const pane = document.createElement('div');
    pane.className = 'pane';
    pane.innerHTML = `<div class="head">${icon('terminal')}<span class="title"></span>${closeButton}</div><div class="term"></div>`;
    pane.querySelector('.title').textContent = title;
    pane.querySelector('.close').onclick = e => { e.stopPropagation(); closeTerminal(id); };
    pane.addEventListener('mousedown', () => activate(id));
    panesEl.appendChild(pane);

    const tab = document.createElement('div');
    tab.className = 'tab';
    tab.innerHTML = `${icon('terminal')}<span></span>${closeButton}`;
    tab.querySelector('span').textContent = title;
    tab.querySelector('.close').onclick = e => { e.stopPropagation(); closeTerminal(id); };
    tab.onclick = () => activate(id);
    tabsEl.appendChild(tab);

    const term = new Terminal({
      // Nerd Fonts first so prompt themes (oh-my-posh etc.) get their glyphs when one is installed.
      fontFamily: '"CaskaydiaCove NFM", "MesloLGS Nerd Font Mono", "Cascadia Mono", Consolas, monospace',
      fontSize: 14,
      cursorBlink: true,
      theme: termTheme(THEMES[settings.theme] ?? THEMES['Catppuccin Mocha'])
    });
    const fit = new FitAddon.FitAddon();
    term.loadAddon(fit);
    terms.set(id, { term, fit, pane, tab });

    activate(id);
    arrange();
    term.open(pane.querySelector('.term'));
    fit.fit();
    term.onData(d => send({ t: 'in', id, d }));
    term.onResize(size => send({ t: 'resize', id, cols: size.cols, rows: size.rows }));
    send({ t: 'start', id, cols: term.cols, rows: term.rows });
    fitAll();
    tab.scrollIntoView();
    term.focus();
  }

  function closeTerminal(id) {
    removeTerminal(id);
    send({ t: 'close', id });
  }

  function removeTerminal(id) {
    const entry = terms.get(id);
    if (!entry) return;
    entry.term.dispose();
    entry.pane.remove();
    entry.tab.remove();
    terms.delete(id);
    if (activeId === id) {
      activeId = null;
      const last = [...terms.keys()].pop();
      if (last !== undefined) activate(last);
    }
    arrange();
    fitAll();
  }

  function activate(id) {
    if (activeId === id) return;
    activeId = id;
    for (const [key, entry] of terms) {
      entry.pane.classList.toggle('active', key === id);
      entry.tab.classList.toggle('active', key === id);
    }
    fitAll();
    focusActive();
  }

  function focusActive() {
    requestAnimationFrame(() => terms.get(activeId)?.term.focus());
  }

  // Grid mode: a near-square grid, with the last pane stretched to fill any gap.
  function arrange() {
    const grid = settings.layout === 'grid';
    const count = grid ? Math.max(terms.size, 1) : 1;
    const cols = Math.ceil(Math.sqrt(count));
    const rows = Math.ceil(count / cols);
    panesEl.style.gridTemplateColumns = `repeat(${cols}, minmax(0, 1fr))`;
    panesEl.style.gridTemplateRows = `repeat(${rows}, minmax(0, 1fr))`;
    const panes = [...terms.values()].map(entry => entry.pane);
    panes.forEach((pane, i) => {
      const last = grid && i === panes.length - 1;
      pane.style.gridColumn = last ? `span ${cols * rows - count + 1}` : '';
    });
    document.body.classList.toggle('empty', terms.size === 0);
    $('count').textContent = terms.size === 1 ? '1 terminal' : `${terms.size} terminals`;
  }

  function fitAll() {
    requestAnimationFrame(() => {
      for (const entry of terms.values())
        if (entry.pane.offsetParent !== null) entry.fit.fit();
    });
  }

  function setLayout(mode) {
    const grid = mode === 'grid';
    settings.layout = grid ? 'grid' : 'tabs';
    document.body.classList.toggle('grid', grid);
    document.body.classList.toggle('tabs', !grid);
    $('layout').setAttribute('aria-checked', grid);
    $('layout').dataset.tip = grid ? 'Tiled evenly · click for tabs' : 'Tabs · click to tile evenly';
    arrange();
    fitAll();
  }

  function init(msg) {
    settings = { ...settings, ...msg.settings };
    $('shell').replaceChildren(...msg.shells.map(name => new Option(name, name)));
    $('shell').value = settings.shell;
    $('program').value = settings.program;
    $('themes').replaceChildren(...Object.entries(THEMES).map(([name, theme]) => {
      const swatch = document.createElement('button');
      swatch.className = 'swatch';
      swatch.dataset.name = name;
      swatch.style.cssText = `background:${theme.bg};color:${theme.fg};--accent:${theme.accent}`;
      const dots = theme.ansi.split(' ').slice(1, 6).map(color => `<b style="background:${color}"></b>`).join('');
      swatch.innerHTML = `<i>${dots}</i>${name}`;
      swatch.onclick = () => { settings.theme = name; applyTheme(name); saveSettings(); };
      return swatch;
    }));
    applyTheme(settings.theme);
    setLayout(settings.layout);
  }

  // ---- Claude status panel ----

  let claude = null;   // the last status message
  let openSession;     // key of the expanded session; undefined until the first status picks one
  const STATUS = { running: 'Running', waiting: 'Waiting', idle: 'Idle', failed: 'Error', unknown: 'Unknown', done: 'Done', stopped: 'Stopped' };
  const EVENT_ICON = { prompt: 'prompt', tool: 'tool', error: 'alert', system: 'activity' };

  const esc = text => String(text ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
  const tokens = n => n < 1000 ? String(n) : n < 999500 ? Math.round(n / 1000) + 'k' : (n / 1e6).toFixed(1) + 'M';
  const clock = ms => new Date(ms).toLocaleTimeString([], { hour12: false });

  function span(seconds) {
    const s = Math.max(0, Math.floor(seconds));
    return s < 60 ? s + 's' : s < 3600 ? Math.floor(s / 60) + 'm' : s < 86400 ? Math.floor(s / 3600) + 'h' : Math.floor(s / 86400) + 'd';
  }
  const ago = ms => ms ? span((Date.now() - ms) / 1000) + ' ago' : '';

  function agentRows(nodes, depth) {
    return nodes.map(agent => {
      const ran = agent.started ? span(((agent.status === 'running' ? Date.now() : agent.last ?? agent.started) - agent.started) / 1000) : '';
      return `<div class="row" style="padding-left:${depth * 14}px" title="${esc(STATUS[agent.status])} · ${esc(agent.desc)}">
          <span class="dot ${agent.status}"></span><b>${esc(agent.label)}</b><span class="text">${esc(agent.desc)}</span>
          <span class="num">${ran}${agent.tokens ? ' · ' + tokens(agent.tokens) : ''}</span>
        </div>` + agentRows(agent.children, depth + 1);
    }).join('');
  }

  function sessionCard(s) {
    const open = s.key === openSession;
    const meta = [];
    // A session running in one of this window's terminals names it: a click jumps there.
    const here = terms.get(s.terminal);
    if (here) meta.push(`<span class="here" title="Click to jump to this terminal">${icon('terminal')}${esc(here.tab.querySelector('span').textContent)}</span>`);
    if (s.repo) meta.push(icon('branch') + esc(s.repo) + (s.branch ? ' · ' + esc(s.branch) : ''));
    if (s.model) meta.push(esc(s.model.replace(/^claude-/, '')));
    if (s.tokens) meta.push(tokens(s.tokens) + ' tokens');
    if (s.agentCount) meta.push(icon('bot') + (s.agentsRunning ? `${s.agentsRunning} of ${s.agentCount} running` : `${s.agentCount} agents`));
    if (s.last) meta.push(ago(s.last));
    let html = `<div class="card ${open ? 'open' : ''}"><div class="card-top" data-key="${esc(s.key)}">
        <div class="card-line"><span class="dot ${s.status}"></span><span class="card-title">${esc(s.title || s.repo || s.cwd || 'Session ' + s.pid)}</span>
        <span class="pill ${s.status}" title="${esc(s.waitingFor)}">${STATUS[s.status] ?? esc(s.status)}</span></div>
        <div class="card-meta">${meta.map(m => `<span>${m}</span>`).join('')}</div></div>`;
    if (!open) return html + '</div>';

    const facts = [['Directory', s.cwd], ['Worktree', s.linked ? s.worktree + ' (linked)' : null], ['Waiting for', s.waitingFor],
      ['Started', s.started ? ago(s.started) : null], ['Process', s.pid + (s.version ? ' · Claude Code ' + s.version : '')]];
    html += `<div class="card-body"><div class="kv">${facts.filter(f => f[1]).map(f => `<b>${f[0]}</b><span>${esc(f[1])}</span>`).join('')}</div>`;
    if (s.agentCount)
      html += `<div class="sub">${icon('bot')}Agents · ${s.agentCount}${s.agentsOmitted ? ` (${s.agentsOmitted} not shown)` : ''}</div>
        <div class="list" data-scroll="agents">${agentRows(s.agents, 0)}</div>`;
    if (s.activity.length)
      html += `<div class="sub">${icon('activity')}Activity</div><div class="list" data-scroll="activity">${[...s.activity].reverse().map(event =>
        `<div class="row ${event.kind}" title="${esc(event.text)}"><span class="num">${clock(event.at)}</span>${icon(EVENT_ICON[event.kind] ?? 'activity')}<span class="text">${esc(event.text)}</span></div>`).join('')}</div>`;
    return html + '</div></div>';
  }

  // Replaces a panel's content without throwing the reader back to the top of what they were reading.
  function rebuild(body, html) {
    const top = body.scrollTop;
    const scrolled = [...body.querySelectorAll('[data-scroll]')].map(list => [list.dataset.scroll, list.scrollTop]);
    body.innerHTML = html;
    body.scrollTop = top;
    for (const [name, position] of scrolled) {
      const list = body.querySelector(`[data-scroll="${name}"]`);
      if (list) list.scrollTop = position;
    }
  }

  // "17:30" today, "Tue 06:00" on another day.
  function when(ms) {
    const date = new Date(ms);
    const time = date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: false });
    return date.toDateString() === new Date().toDateString() ? time : date.toLocaleDateString([], { weekday: 'short' }) + ' ' + time;
  }

  // "12m", "2h 5m", "3d 12h"
  function countdown(ms) {
    const minutes = Math.max(0, Math.round((ms - Date.now()) / 60000));
    const d = Math.floor(minutes / 1440), h = Math.floor(minutes % 1440 / 60), m = minutes % 60;
    return d ? `${d}d ${h}h` : h ? `${h}h ${m}m` : `${m}m`;
  }

  // The plan's usage windows, above the sessions: how much is used and when each resets.
  function usageRows(sessions) {
    const usage = claude?.usage;
    const total = sessions.reduce((sum, s) => sum + s.tokens, 0);
    const live = sessions.length ? `${plural(sessions.length, 'live session')} · ${tokens(total)} tokens` : '';
    if (!usage)
      return claude ? `<div class="note">Usage limits are not available: they come from the Claude Code status line's cache.</div>${live && `<div class="note">${live}</div>`}` : '';
    const rows = usage.windows.map(w => {
      // Past its reset time, the saved figure belongs to the window before.
      const over = w.resets && w.resets <= Date.now();
      const percent = over ? 0 : Math.min(100, Math.round(w.percent));
      const level = percent >= 80 ? 'high' : percent >= 50 ? 'mid' : 'low';
      const note = !w.resets ? '' : over ? `reset at ${when(w.resets)} · no reading since` : `resets ${when(w.resets)} · in ${countdown(w.resets)}`;
      return `<b>${esc(w.label)}</b><div class="meter ${level}"><i style="width:${percent}%"></i></div><span class="pct ${level}">${over ? '–' : percent + '%'}</span>
        <div class="note">${note}</div>`;
    }).join('');
    const extra = usage.extra == null ? '' : `<b>Extra usage</b><div class="meter mid"><i style="width:${Math.min(100, Math.round(usage.extra))}%"></i></div><span class="pct mid">${Math.round(usage.extra)}%</span><div class="note"></div>`;
    return rows + extra + `<div class="note">${live && live + ' · '}read ${ago(usage.at)}</div>`;
  }

  function renderClaude() {
    const sessions = claude?.sessions ?? [];
    const count = status => sessions.filter(s => s.status === status).length;
    const running = count('running'), waiting = count('waiting');
    const summary = [`${sessions.length} session${sessions.length === 1 ? '' : 's'}`, running && `${running} running`, waiting && `${waiting} waiting`].filter(Boolean).join(' · ');
    $('status').dataset.tip = 'Claude status · ' + summary;
    $('status').querySelector('.dot').className = 'dot ' + (waiting ? 'waiting' : running ? 'running' : '');
    if (panel !== 'claude') return;

    $('claude-summary').textContent = summary;
    $('claude-usage').innerHTML = usageRows(sessions);
    const body = $('claude-body');
    if (!claude) { body.innerHTML = '<div class="c-empty">Reading Claude sessions…</div>'; return; }
    if (openSession === undefined) openSession = sessions[0]?.key;
    rebuild(body, sessions.length ? sessions.map(sessionCard).join('') : '<div class="c-empty">No Claude sessions are running.</div>');
  }

  // ---- Git panel: the repositories of the Claude sessions ----

  let repos = null;   // the last repositories received; they only arrive while the panel is open
  let openTree;       // path of the expanded worktree
  const plural = (n, word) => `${n} ${word}${n === 1 ? '' : 's'}`;
  const shortPath = path => '…\\' + path.split(/[\\/]/).filter(Boolean).slice(-2).join('\\');

  function treeRow(tree) {
    const open = tree.path === openTree;
    const changes = [['staged', '+', tree.staged, 'staged'], ['changed', '~', tree.modified, 'modified'], ['untracked', '?', tree.untracked, 'untracked'], ['conflict', '!', tree.conflicts, 'in conflict']]
      .filter(change => change[2]);
    const sync = [tree.ahead && '↑' + tree.ahead, tree.behind && '↓' + tree.behind].filter(Boolean).join(' ');
    const live = tree.sessions.length;
    let html = `<div class="tree ${open ? 'open' : ''}"><div class="tree-top" data-tree="${esc(tree.path)}" title="${esc(tree.path)}">
        <div class="row ${live ? 'running' : 'idle'}">${icon('branch')}<b>${esc(tree.branch ?? 'no branch')}</b>
          <span class="chip" title="${esc(tree.upstream ? `${tree.ahead} ahead of ${tree.upstream}, ${tree.behind} behind` : '')}">${sync}</span><span class="text"></span>
          ${changes.length ? changes.map(c => `<span class="chip ${c[0]}" title="${c[2]} ${c[3]}">${c[1]}${c[2]}</span>`).join('') : '<span class="chip clean">clean</span>'}
          ${live ? `<span class="pill running">${plural(live, 'session')}</span>` : ''}</div>
        <div class="tree-path">${tree.main ? 'main worktree' : esc(shortPath(tree.path))}</div></div>`;
    if (!open) return html + '</div>';

    const names = tree.sessions.map(key => claude?.sessions.find(s => s.key === key)).filter(Boolean).map(s => s.title || 'Session ' + s.pid);
    const facts = [['Path', tree.path],
      ['Upstream', tree.upstream ? `${tree.upstream} · ${tree.ahead || tree.behind ? [tree.ahead && tree.ahead + ' ahead', tree.behind && tree.behind + ' behind'].filter(Boolean).join(', ') : 'up to date'}` : 'none'],
      ['Last commit', tree.commit ? `${tree.commit.hash} ${tree.commit.subject} · ${ago(tree.commit.at)}` : null],
      ['Changes', changes.length ? changes.map(c => `${c[2]} ${c[3]}`).join(' · ') : 'working tree clean'],
      ['Claude', names.join(', ')]];
    html += `<div class="tree-body"><div class="kv">${facts.filter(f => f[1]).map(f => `<b>${f[0]}</b><span>${esc(f[1])}</span>`).join('')}</div>`;
    if (tree.files.length)
      html += `<div class="list" data-scroll="files" style="margin-top:8px">${tree.files.map(file =>
        // XY: staged change, then unstaged; "." is none.
        `<div class="row ${file.code === '?' ? 'untracked' : file.code === 'U' ? 'conflict' : file.code[1] === '.' ? 'staged' : 'changed'}" title="${esc(file.path)}">
          <span class="code">${esc(file.code.replaceAll('.', '·'))}</span><span class="text">${esc(file.path)}</span></div>`).join('')}</div>`;
    return html + '</div></div>';
  }

  function repoCard(repo) {
    const remotes = repo.remotes.map(remote => `<div class="row">${icon('link')}<b>${esc(remote.name)}</b>` +
      (remote.web ? `<a class="text link" data-url="${esc(remote.web)}" title="Open ${esc(remote.web)}">${esc(remote.url)}</a>` : `<span class="text">${esc(remote.url)}</span>`) + '</div>').join('');
    return `<div class="card"><div class="repo-top"><div class="card-line"><span class="card-title" title="${esc(repo.root)}">${esc(repo.repo)}</span>
      <span class="num">${plural(repo.trees.length, 'worktree')}</span></div>${remotes || '<div class="row idle"><span class="text">No remote</span></div>'}</div>
      ${repo.trees.map(treeRow).join('')}</div>`;
  }

  function renderGit() {
    if (panel !== 'git') return;
    const body = $('git-body');
    if (!repos) { body.innerHTML = '<div class="c-empty">Reading repositories…</div>'; return; }
    $('git-summary').textContent = repos.length ? `${repos.length} ${repos.length === 1 ? 'repository' : 'repositories'} ·${plural(repos.reduce((n, repo) => n + repo.trees.length, 0), 'worktree')}` : '';
    rebuild(body, repos.length ? repos.map(repoCard).join('')
      : '<div class="c-empty">No repositories. This lists the repositories that have a Claude session running in them.</div>');
  }

  // ---- The side panel: Claude or Git, one at a time ----

  let panel = null; // 'claude', 'git' or null

  function showPanel(name) {
    panel = panel === name ? null : name;
    document.body.classList.toggle('claude-open', panel === 'claude');
    document.body.classList.toggle('git-open', panel === 'git');
    send({ t: 'git', open: panel === 'git' }); // git is only asked while its panel is open
    renderClaude();
    renderGit();
    focusActive();
  }

  $('status').onclick = () => showPanel('claude');
  $('git').onclick = () => showPanel('git');
  $('claude-close').onclick = $('git-close').onclick = () => showPanel(panel);
  $('git-body').onclick = e => {
    const link = e.target.closest('.link');
    if (link) return send({ t: 'open', url: link.dataset.url });
    const top = e.target.closest('.tree-top');
    if (!top) return;
    openTree = openTree === top.dataset.tree ? null : top.dataset.tree;
    renderGit();
  };
  $('claude-body').onclick = e => {
    const top = e.target.closest('.card-top');
    if (!top) return;
    openSession = openSession === top.dataset.key ? null : top.dataset.key;
    renderClaude();
    const terminal = claude.sessions.find(s => s.key === top.dataset.key)?.terminal;
    if (terms.has(terminal)) {
      activate(terminal);
      terms.get(terminal).tab.scrollIntoView();
      focusActive();
    }
  };
  setInterval(() => { renderClaude(); renderGit(); }, 15000); // keeps the "ago" times moving while nothing changes

  window.addEventListener('HybridWebViewMessageReceived', e => {
    const msg = JSON.parse(e.detail.message);
    switch (msg.t) {
      case 'out':
        terms.get(msg.id)?.term.write(Uint8Array.from(atob(msg.d), c => c.charCodeAt(0)));
        break;
      case 'new': addTerminal(msg.id, msg.title); break;
      case 'exit': removeTerminal(msg.id); break;
      case 'init': init(msg); break;
      case 'status':
        claude = msg;
        if (msg.git) repos = msg.git;
        renderClaude();
        renderGit();
        break;
    }
  });

  $('new').onclick = $('empty-new').onclick = () => send({ t: 'new' });
  $('layout').onclick = () => { setLayout(settings.layout === 'grid' ? 'tabs' : 'grid'); saveSettings(); focusActive(); };
  $('settings').onclick = () => dialog.showModal();
  $('dialog-close').onclick = () => dialog.close();
  dialog.addEventListener('click', e => { if (e.target === dialog) dialog.close(); });
  dialog.addEventListener('close', focusActive);
  $('shell').onchange = () => { settings.shell = $('shell').value; saveSettings(); };
  $('program').oninput = () => { settings.program = $('program').value.trim(); saveSettings(); };

  new ResizeObserver(fitAll).observe(panesEl);
  send({ t: 'ready' });
</script>
</body>
</html>
